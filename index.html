<!DOCTYPE html>
<html lang="ja">
<head>
<script>
  window.addEventListener('error', function(e) {
    alert("エラー検知:\n" + e.message + "\n行: " + e.lineno + "\nファイル: " + e.filename);
  });
  window.addEventListener('unhandledrejection', function(e) {
    alert("Promiseエラー:\n" + (e.reason ? (e.reason.message || e.reason) : e));
  });
</script>
